<app-header class="sticky-top"/>

<div class="socials">
	<a class="socials__item socials__item--facebook" href="https://www.facebook.com/MoonKoradjiRecords/" target="_blank" rel="noreferrer"
		[matTooltip]="'Facebook'" [matTooltipPosition]="'left'" [matTooltipShowDelay]="100" aria-label="Facebook"
	>
		<app-svg-icon icon="facebook"/>
	</a>

	<a class="socials__item socials__item--soundcloud" href="https://soundcloud.com/moon-koradji-records" target="_blank" rel="noreferrer"
		[matTooltip]="'SoundCloud'" [matTooltipPosition]="'left'" [matTooltipShowDelay]="100" aria-label="SoundCloud"
	>
		<app-svg-icon icon="soundcloud"/>
	</a>

	<a class="socials__item socials__item--youtube" href="https://www.youtube.com/user/MoonKoradji?sub_confirmation=1" target="_blank" rel="noreferrer"
		[matTooltip]="'YouTube'" [matTooltipPosition]="'left'" [matTooltipShowDelay]="100" aria-label="YouTube"
	>
		<app-svg-icon icon="youtube"/>
	</a>

	<a class="socials__item socials__item--instagram" href="https://www.instagram.com/moonkoradjirecords/" target="_blank" rel="noreferrer"
		[matTooltip]="'Instagram'" [matTooltipPosition]="'left'" [matTooltipShowDelay]="100" aria-label="Instagram"
	>
		<app-svg-icon icon="instagram"/>
	</a>

	<a class="socials__item socials__item--tiktok" href="https://www.tiktok.com/@moonkoradji" target="_blank" rel="noreferrer"
		[matTooltip]="'TikTok'" [matTooltipPosition]="'left'" [matTooltipShowDelay]="100" aria-label="TikTok"
	>
		<app-svg-icon icon="tiktok" cssClass="socials__icon"/>
	</a>
	
	<a class="socials__item socials__item--bandcamp" href="https://moonkoradjirecords.bandcamp.com/follow_me" target="_blank" rel="noreferrer"
		[matTooltip]="'Bandcamp'" [matTooltipPosition]="'left'" [matTooltipShowDelay]="100" aria-label="Bandcamp"
	>
		<app-svg-icon icon="bandcamp"/>
	</a>
</div>

@if (showing()) {
	<main class="container page" [class.dark]="showBackground()">
		<router-outlet/>
	</main>

	<app-footer/>

	<app-scroll-to-top/>
} 
@else {
	<div class="load"></div>
}

@if (showBackground()) {
	<div class="background"></div>

	<div class="background2"></div>

	<div class="anchor">
		<div class="anchor__side"></div>
		<div class="anchor__container container"></div>
		<div class="anchor__side"></div>
	</div>
	
	<div class="anchor bottom">
		<div class="anchor__side"></div>
		<div class="anchor__container container"></div>
		<div class="anchor__side"></div>
	</div>
}
