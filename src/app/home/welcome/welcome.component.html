<section class="welcome">
  <canvas #canvas class="welcome-canvas" aria-hidden="true"></canvas>

  <div class="orb orb-left" aria-hidden="true"></div>
  <div class="orb orb-right" aria-hidden="true"></div>

  <div class="welcome-content">
    <p #eyebrow class="eyebrow">Independent Psytrance Label</p>

    <h1 class="welcome-title">
      <span #titleAccent class="title title-accent">
        <span class="letter">M</span><span class="letter">O</span><span class="letter">O</span><span class="letter">N</span>
        <span class="letter space"> </span>
        <span class="letter">K</span><span class="letter">O</span><span class="letter">R</span><span class="letter">A</span><span class="letter">D</span><span class="letter">J</span><span class="letter">I</span>
      </span>

      <span #titleRecords class="title">
        <span class="letter">R</span><span class="letter">E</span><span class="letter">C</span><span class="letter">O</span><span class="letter">R</span><span class="letter">D</span><span class="letter">S</span>
      </span>
    </h1>

    <p #subtitle class="subtitle">World Wide Psychedelic</p>
  </div>

  <div class="chevron" aria-hidden="true">⌄</div>
</section>
