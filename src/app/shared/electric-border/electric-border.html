<div class="main-container">
    <svg class="svg-container">
        <defs>
            <filter id="turbulent-displace" colorInterpolationFilters="linearRGB" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="5" result="noise1" seed="1" />
                <feOffset in="noise1" dy="0" result="offsetNoise1">
                    <animate attributeName="dy" values="700; 0" dur="6s" repeatCount="indefinite" />
                </feOffset>
                <feOffset in="noise1" dy="0" result="offsetNoise2">
                    <animate attributeName="dy" values="0; -700" dur="6s" repeatCount="indefinite" />
                </feOffset>

                <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="5" result="noise2" seed="2" />
                <feOffset in="noise2" dx="0" result="offsetNoise3">
                    <animate attributeName="dx" values="490; 0" dur="6s" repeatCount="indefinite" />
                </feOffset>
                <feOffset in="noise2" dx="0" result="offsetNoise4">
                    <animate attributeName="dx" values="0; -490" dur="6s" repeatCount="indefinite" />
                </feOffset>

                <feComposite in="offsetNoise1" in2="offsetNoise2" result="part1" />
                <feComposite in="offsetNoise3" in2="offsetNoise4" result="part2" />
                <feBlend in="part1" in2="part2" mode="color-dodge" result="combinedNoise" />

                <feDisplacementMap in="SourceGraphic" in2="combinedNoise" scale="30" xChannelSelector="R" yChannelSelector="B" />
            </filter>
        </defs>
    </svg>

    <div class="card-container">
        <div class="inner-container">
            <div class="border-outer">
                <div class="main-card" [class.filter-active]="filterEnabled()"></div>
            </div>
            <div class="glow-layer-1"></div>
            <div class="glow-layer-2"></div>
        </div>

        <div class="overlay-1"></div>
        <div class="overlay-2"></div>

        <div class="content-container">
            <ng-content></ng-content>
        </div>
    </div>
</div>
